<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拼音小达人 - 趣味学拼音</title>
    <meta name="description" content="一款帮助小学生学习汉语拼音的趣味网站">
    <link rel="stylesheet" href="css/style.css">
    <!-- 引入 pinyin-pro 库 -->
    <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.18.2/dist/index.js"></script>
    <!-- 引入可爱字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- 头部标题 -->
        <header class="header">
            <h1 class="title">
                <span class="emoji">🌟</span>
                拼音小达人
                <span class="emoji">🌟</span>
            </h1>
            <p class="subtitle">输入拼音，解锁汉字，成为拼音高手！</p>
        </header>

        <!-- 输入区域 -->
        <section id="input-section" class="input-section">
            <div class="input-container">
                <label for="text-input" class="input-label">
                    <span class="icon">📝</span> 请输入要学习的文字
                </label>
                <textarea 
                    id="text-input" 
                    class="text-input" 
                    placeholder="在这里输入或粘贴一段中文，比如：小明今天很开心"
                    rows="4"
                ></textarea>
                <button id="start-btn" class="start-btn">
                    <span class="btn-icon">🚀</span>
                    开始学习
                </button>
            </div>
        </section>

        <!-- 练习区域 -->
        <section id="practice-section" class="practice-section hidden">
            <!-- 进度条 -->
            <div class="progress-container">
                <div class="progress-info">
                    <span class="progress-text">学习进度</span>
                    <span id="progress-percent" class="progress-percent">0%</span>
                </div>
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
            </div>

            <!-- 控制按钮 -->
            <div class="control-buttons">
                <button id="back-btn" class="control-btn back-btn">
                    <span>↩️</span> 返回修改
                </button>
                <button id="reset-btn" class="control-btn reset-btn">
                    <span>🔄</span> 重新开始
                </button>
            </div>

            <!-- 汉字卡片区 -->
            <div id="cards-container" class="cards-container"></div>
        </section>

        <!-- 拼音输入弹窗 -->
        <div id="pinyin-modal" class="modal hidden">
            <div class="modal-overlay"></div>
            <div class="modal-content">
                <div class="modal-header">
                    <span id="modal-char" class="modal-char">字</span>
                </div>
                <div class="modal-body">
                    <input 
                        type="text" 
                        id="pinyin-input" 
                        class="pinyin-input" 
                        placeholder="输入拼音（如：nǐ）"
                        autocomplete="off"
                    >
                    <div id="error-msg" class="error-msg hidden">
                        <span>😅</span> 再试试看！
                    </div>
                    <div class="tone-helper">
                        <span class="tone-label">声调帮手：</span>
                        <button class="tone-btn" data-tone="ā">ā</button>
                        <button class="tone-btn" data-tone="á">á</button>
                        <button class="tone-btn" data-tone="ǎ">ǎ</button>
                        <button class="tone-btn" data-tone="à">à</button>
                        <span class="tone-sep">|</span>
                        <button class="tone-btn" data-tone="ō">ō</button>
                        <button class="tone-btn" data-tone="ó">ó</button>
                        <button class="tone-btn" data-tone="ǒ">ǒ</button>
                        <button class="tone-btn" data-tone="ò">ò</button>
                        <span class="tone-sep">|</span>
                        <button class="tone-btn" data-tone="ē">ē</button>
                        <button class="tone-btn" data-tone="é">é</button>
                        <button class="tone-btn" data-tone="ě">ě</button>
                        <button class="tone-btn" data-tone="è">è</button>
                    </div>
                    <div class="tone-helper">
                        <span class="tone-label"></span>
                        <button class="tone-btn" data-tone="ī">ī</button>
                        <button class="tone-btn" data-tone="í">í</button>
                        <button class="tone-btn" data-tone="ǐ">ǐ</button>
                        <button class="tone-btn" data-tone="ì">ì</button>
                        <span class="tone-sep">|</span>
                        <button class="tone-btn" data-tone="ū">ū</button>
                        <button class="tone-btn" data-tone="ú">ú</button>
                        <button class="tone-btn" data-tone="ǔ">ǔ</button>
                        <button class="tone-btn" data-tone="ù">ù</button>
                        <span class="tone-sep">|</span>
                        <button class="tone-btn" data-tone="ǖ">ǖ</button>
                        <button class="tone-btn" data-tone="ǘ">ǘ</button>
                        <button class="tone-btn" data-tone="ǚ">ǚ</button>
                        <button class="tone-btn" data-tone="ǜ">ǜ</button>
                    </div>
                </div>
                <div class="modal-footer">
                    <button id="hint-btn" class="modal-btn hint-btn">
                        <span>💡</span> 提示
                    </button>
                    <button id="submit-btn" class="modal-btn submit-btn">
                        <span>✅</span> 确定
                    </button>
                </div>
                <button id="close-modal" class="close-modal">✕</button>
            </div>
        </div>

        <!-- 完成庆祝弹窗 -->
        <div id="celebrate-modal" class="modal hidden">
            <div class="modal-overlay"></div>
            <div class="celebrate-content">
                <div class="celebrate-emoji">🎉</div>
                <h2 class="celebrate-title">太棒了！</h2>
                <p class="celebrate-text">你已经完成了所有汉字的学习！</p>
                <button id="celebrate-btn" class="celebrate-btn">
                    <span>🌈</span> 继续学习新内容
                </button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
